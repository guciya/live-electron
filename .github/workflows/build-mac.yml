name: Build Mac DMG

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      arch:
        description: '架构'
        required: true
        default: 'both'
        type: choice
        options:
          - x64
          - arm64
          - both

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Electron app
        run: |
          ARCH="${{ github.event.inputs.arch }}"
          if [ "$ARCH" = "" ] || [ "$ARCH" = "both" ]; then
            npx electron-builder --mac --x64 --arm64 --dir
          else
            npx electron-builder --mac --$ARCH --dir
          fi

      - name: Stage DMG contents
        run: |
          cd dist
          for dir in mac mac-arm64; do
            if [ -d "$dir" ]; then
              staging="dmg-stage-$dir"
              mkdir -p "$staging"
              app=$(ls -d "$dir"/*.app | head -1)
              ditto "$app" "$staging/NikoLive.app"
              cp ../build/install.command "$staging/安装.command"
              chmod +x "$staging/安装.command"
            fi
          done

      - name: Create DMG
        run: |
          cd dist
          for dir in mac mac-arm64; do
            [ -d "$dir" ] || continue
            arch_suffix="${dir#mac}"
            [ "$arch_suffix" = "" ] && arch_suffix="x64"
            echo "Creating DMG for $arch_suffix ..."
            hdiutil create -volname "NikoLive" -srcfolder "dmg-stage-$dir" -ov -format UDZO "NikoLive-$arch_suffix.dmg"
          done

      - name: Set Finder layout (best-effort)
        run: |
          cd dist
          for dmg in NikoLive-*.dmg; do
            [ -f "$dmg" ] || continue
            echo "Setting Finder layout for $dmg ..."
            hdiutil attach "$dmg" -nobrowse -quiet || true
            sleep 2
            osascript -e 'tell application "Finder" to tell disk "NikoLive" to open' 2>/dev/null || echo "  (osascript unavailable, skipping layout)"
            hdiutil detach /Volumes/NikoLive -quiet 2>/dev/null || true
          done
          echo "Finder layout step done (non-fatal)"
        continue-on-error: true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: NikoLive-mac-dmg
          path: dist/NikoLive-*.dmg
          retention-days: 30
