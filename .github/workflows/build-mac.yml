name: Build Mac DMG

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      arch:
        description: '架构'
        required: true
        default: 'both'
        type: choice
        options:
          - x64
          - arm64
          - both

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Electron app
        run: |
          ARCH="${{ github.event.inputs.arch }}"
          if [ "$ARCH" = "" ] || [ "$ARCH" = "both" ]; then
            npx electron-builder --mac --x64 --arm64 --dir
          else
            npx electron-builder --mac --$ARCH --dir
          fi
          echo "--- electron-builder output dirs ---"
          ls -la release/ 2>/dev/null || true

      - name: Stage + Create DMG
        run: |
          set -e
          for dir in release/mac release/mac-arm64; do
            [ -d "$dir" ] || continue
            arch_suffix=""
            case "$dir" in
              *mac-arm64) arch_suffix="arm64" ;;
              *mac)        arch_suffix="x64" ;;
            esac
            echo "=== Processing $dir ($arch_suffix) ==="
            staging="release/dmg-stage-$arch_suffix"
            rm -rf "$staging"
            mkdir -p "$staging"
            app=$(ls -d "$dir"/*.app | head -1)
            echo "App: $app"
            ditto "$app" "$staging/NikoLive.app"
            cp build/install.command "$staging/安装.command"
            chmod +x "$staging/安装.command"
            dmg="release/NikoLive-$arch_suffix.dmg"
            echo "Creating DMG: $dmg"
            hdiutil create -volname "NikoLive" -srcfolder "$staging" -ov -format UDZO "$dmg"
            echo "✅ DMG created: $dmg"
          done
          echo "--- Final listing ---"
          ls -lh release/*.dmg 2>/dev/null

      - name: Set Finder layout (best-effort)
        run: |
          for dmg in release/NikoLive-*.dmg; do
            [ -f "$dmg" ] || continue
            echo "Setting Finder layout for $dmg ..."
            hdiutil attach "$dmg" -nobrowse -quiet || true
            sleep 2
            osascript -e 'tell application "Finder" to tell disk "NikoLive" to open' 2>/dev/null || echo "  (osascript unavailable, skipping)"
            hdiutil detach /Volumes/NikoLive -quiet 2>/dev/null || true
          done
        continue-on-error: true

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: NikoLive-mac-dmg
          path: release/NikoLive-*.dmg
          if-no-files-found: error
          retention-days: 30
