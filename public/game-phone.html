<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title id="phone-title">手机游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    -webkit-user-select: none;
  }

  /* ========== 手机外壳 ========== */
  .phone-shell {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, #1a1a22 0%, #0d0d12 100%);
    border-radius: 48px;
    overflow: hidden;
    /* 外发光边框，让 frame:false 的窗口也有外壳质感 */
    box-shadow:
      0 0 0 2px #2a2a36 inset,
      0 0 0 4px #000 inset,
      0 30px 60px rgba(0,0,0,0.6);
  }

  /* ========== 窗口控制按钮（最小化 / 最大化 / 关闭） ========== */
  .phone-titlebar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 4px;
    padding: 0 14px;
    z-index: 20;
    /* frame:false 窗口靠这里拖动 */
    -webkit-app-region: drag;
  }
  .phone-titlebar .win-btn {
    width: 40px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    outline: none;
    background: transparent;
    color: rgba(255, 255, 255, 0.78);
    font-size: 15px;
    line-height: 1;
    border-radius: 8px;
    cursor: pointer;
    -webkit-app-region: no-drag;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .phone-titlebar .win-btn:hover {
    background: rgba(255, 255, 255, 0.16);
    color: #fff;
  }
  .phone-titlebar .win-btn-close:hover {
    background: #e81123;
    color: #fff;
  }

  /* 最大化后不再需要手机圆角 */
  @media (min-width: 700px) {
    .phone-shell { border-radius: 16px; }
  }

  /* ========== 顶部刘海区 ========== */
  .phone-notch-area {
    flex: none;
    height: 48px;
    position: relative;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 动态刘海：当 iframe 内容有状态栏时显示 */
  .phone-notch {
    width: 120px;
    height: 28px;
    background: #000;
    border-radius: 0 0 16px 16px;
    position: relative;
  }
  .phone-notch::before {
    /* 摄像头 */
    content: '';
    position: absolute;
    top: 8px; right: 18px;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #555, #111);
    box-shadow: inset 0 0 3px #000;
  }
  .phone-notch::after {
    /* 扬声器 */
    content: '';
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    width: 30px; height: 4px;
    border-radius: 2px;
    background: #222;
  }

  /* 顶部状态栏（模拟 iOS 状态栏） */
  .phone-status-bar {
    flex: none;
    height: 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    font-size: 12px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.9);
    font-family: -apple-system, "SF Pro Text", system-ui, sans-serif;
    background: #000;
  }

  /* ========== 屏幕内容区 ========== */
  .phone-screen {
    flex: 1;
    min-height: 0;
    position: relative;
    background: #000;
  }
  .phone-screen iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    background: #fff;
  }
  .phone-screen .phone-loading {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.5); font-size: 13px;
    background: #0f0f14;
    z-index: 2;
    transition: opacity 0.4s ease;
  }

  /* ========== 底部 Home Indicator ========== */
  .phone-home-indicator {
    flex: none;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  .phone-home-indicator .bar {
    width: 120px;
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.6);
  }
</style>
</head>
<body>
  <div class="phone-shell">
    <div class="phone-titlebar">
      <button class="win-btn" id="btn-min" title="最小化">—</button>
      <button class="win-btn" id="btn-max" title="最大化">□</button>
      <button class="win-btn win-btn-close" id="btn-close" title="关闭">✕</button>
    </div>
    <div class="phone-status-bar">
      <span id="phone-title-short">Niko</span>
      <span style="opacity:0.5; visibility:hidden">● ● ●</span>
    </div>
    <div class="phone-notch-area">
      <div class="phone-notch"></div>
    </div>
    <div class="phone-screen">
      <div class="phone-loading" id="phone-loading">加载中...</div>
      <iframe id="phone-iframe" sandbox="allow-scripts allow-forms allow-same-origin allow-popups allow-modals"></iframe>
    </div>
    <div class="phone-home-indicator"><div class="bar"></div></div>
  </div>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const url = params.get('url');
  const title = params.get('title') || '手机游戏';

  document.getElementById('phone-title').textContent = title;
  document.getElementById('phone-title-short').textContent = title.length > 8 ? title.slice(0, 7) + '…' : title;

  const iframe = document.getElementById('phone-iframe');
  const loading = document.getElementById('phone-loading');

  // 窗口控制：由 TUILiveKit.game.preload.js 暴露，浏览器里直接打开时静默跳过
  const winApi = window.gameWindowApi;
  const bindWinBtn = (id, action) => {
    const btn = document.getElementById(id);
    if (!btn) {
      return;
    }
    btn.addEventListener('click', (event) => {
      event.stopPropagation();
      if (winApi && typeof winApi[action] === 'function') {
        winApi[action]();
      }
    });
  };
  bindWinBtn('btn-min', 'minimize');
  bindWinBtn('btn-max', 'toggleMaximize');
  bindWinBtn('btn-close', 'close');

  if (url) {
    // Chrome-like UA，避免部分站点识别到桌面端
    iframe.setAttribute('referrerpolicy', 'no-referrer');
    iframe.src = url;
    iframe.onload = () => {
      loading.style.opacity = '0';
      setTimeout(() => { loading.style.display = 'none'; }, 400);
    };
    iframe.onerror = () => {
      loading.textContent = '加载失败';
      loading.style.background = '#2a1515';
    };
  } else {
    loading.textContent = '未指定游戏地址';
    loading.style.background = '#2a1515';
  }
})();
</script>
</body>
</html>
