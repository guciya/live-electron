<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Niko直播 启动中</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #150430;
    user-select: none;
    cursor: default;
  }

  .splash {
    position: fixed;
    inset: 0;
    overflow: hidden;
    opacity: 1;
    transition: opacity 0.4s ease;
  }
  body.is-leaving .splash { opacity: 0; }

  /* ---------- 背景场景 ---------- */
  .scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    animation: scene-in 1.6s cubic-bezier(0.16, 0.72, 0.24, 1) both;
    will-change: transform, opacity;
  }
  @keyframes scene-in {
    0%   { opacity: 0; transform: scale(1.06); }
    100% { opacity: 1; transform: scale(1); }
  }

  .splash::after {
    /* 左上角太阳光弥漫 */
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 20% 46%, rgba(255, 236, 140, 0.45), rgba(255, 190, 90, 0.12) 38%, transparent 62%);
    pointer-events: none;
    animation: sun-breathe 5s ease-in-out infinite alternate;
  }
  @keyframes sun-breathe {
    0%   { opacity: 0.72; }
    100% { opacity: 1; }
  }

  .windows-mid  { animation: twinkle 4.2s ease-in-out infinite alternate; }
  .windows-near { animation: twinkle 3.4s ease-in-out 0.6s infinite alternate; }
  @keyframes twinkle {
    0%   { opacity: 0.55; }
    100% { opacity: 1; }
  }

  .cloud { animation: cloud-drift 9s ease-in-out infinite alternate; }
  .cloud.b { animation-duration: 12s; animation-delay: 0.8s; }
  .cloud.c { animation-duration: 10s; animation-delay: -2s; }
  @keyframes cloud-drift {
    0%   { transform: translateX(0); }
    100% { transform: translateX(18px); }
  }

  /* ---------- 居中内容 ---------- */
  .content {
    position: absolute;
    left: 0;
    right: 0;
    top: 46%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    pointer-events: none;
  }

  .logo-wrap {
    position: relative;
    width: 132px;
    height: 132px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: logo-in 1s cubic-bezier(0.18, 1.5, 0.32, 1) 0.3s both;
  }
  @keyframes logo-in {
    0%   { opacity: 0; transform: translateY(16px) scale(0.8); filter: blur(8px); }
    60%  { filter: blur(0); }
    100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
  }

  .halo {
    position: absolute;
    width: 214px;
    height: 214px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 232, 158, 0.5), rgba(255, 186, 96, 0.18) 46%, transparent 70%);
    animation: halo-pulse 2.8s ease-in-out 0.5s infinite;
  }
  @keyframes halo-pulse {
    0%, 100% { opacity: 0.55; transform: scale(0.94); }
    50%      { opacity: 0.95; transform: scale(1.06); }
  }

  .logo {
    position: relative;
    width: 132px;
    height: 132px;
    border-radius: 26px;
    object-fit: cover;
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.16),
      0 0 46px rgba(255, 208, 118, 0.5),
      0 18px 42px rgba(16, 0, 38, 0.55);
  }

  .title {
    margin-top: 20px;
    font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
    font-size: 21px;
    font-weight: 500;
    letter-spacing: 0.1em;
    color: #fff;
    text-shadow: 0 2px 18px rgba(40, 0, 60, 0.45);
    display: flex;
    align-items: baseline;
    animation: text-in 0.7s ease-out 0.85s both;
  }
  @keyframes text-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .dots { display: inline-flex; margin-left: 2px; }
  .dots b {
    display: inline-block;
    font-weight: 500;
    opacity: 0;
    animation: dot-blink 1.25s steps(1, end) infinite;
  }
  .dots b:nth-child(2) { animation-delay: 0.22s; }
  .dots b:nth-child(3) { animation-delay: 0.44s; }
  @keyframes dot-blink {
    0%, 22% { opacity: 0; }
    46%, 100% { opacity: 1; }
  }

  .progress {
    margin-top: 26px;
    width: 176px;
    height: 3px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.22);
    overflow: hidden;
    animation: text-in 0.7s ease-out 0.9s both;
  }
  .progress i {
    display: block;
    width: 0;
    height: 100%;
    border-radius: 3px;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.9), #ffe6a3);
    box-shadow: 0 0 10px rgba(255, 226, 150, 0.85);
    animation: progress-fill 1.5s cubic-bezier(0.3, 0.8, 0.4, 1) 0.55s forwards;
  }
  @keyframes progress-fill {
    from { width: 0; }
    to   { width: 100%; }
  }
</style>
</head>

    <defs>
