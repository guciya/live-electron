<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Niko直播伴侣 启动中</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #061b35;
    user-select: none;
    cursor: default;
  }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #fff;
  }
  .splash {
    position: fixed;
    inset: 0;
    overflow: hidden;
    opacity: 1;
    background:
      radial-gradient(circle at 50% 32%, rgba(34, 170, 255, 0.32), transparent 42%),
      linear-gradient(135deg, #061a38 0%, #087fc1 46%, #04315e 100%);
    transition: opacity 0.5s cubic-bezier(0.4, 0, 0.2, 1);
  }
  body.is-leaving .splash { opacity: 0; }
  .ambient {
    position: absolute;
    inset: -12%;
    background:
      radial-gradient(circle at 26% 26%, rgba(71, 208, 255, 0.42), transparent 30%),
      radial-gradient(circle at 76% 70%, rgba(255, 220, 74, 0.2), transparent 28%),
      radial-gradient(circle at 60% 10%, rgba(255, 255, 255, 0.14), transparent 24%);
    filter: blur(20px);
    animation: ambient-move 5s ease-in-out infinite alternate;
  }
  @keyframes ambient-move {
    from { transform: translate3d(-2%, -1%, 0) scale(1); opacity: 0.72; }
    to { transform: translate3d(2%, 1%, 0) scale(1.08); opacity: 1; }
  }
  .video-stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    animation: stage-in 0.8s ease-out both;
  }
  @keyframes stage-in {
    from { opacity: 0; transform: scale(0.97); filter: blur(8px); }
    to { opacity: 1; transform: scale(1); filter: blur(0); }
  }
  .splash-video,
  .splash-fallback {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    opacity: 0.94;
    filter: saturate(1.18) contrast(1.02) brightness(1.12);
    animation: video-push 5.2s cubic-bezier(0.18, 0.65, 0.3, 1) both;
  }
  @keyframes video-push {
    from { transform: scale(1.01); }
    to { transform: scale(1.045); }
  }
  .splash-fallback { display: none; }
  .video-failed .splash-video { display: none; }
  .video-failed .splash-fallback { display: block; }
  .light-sweep {
    position: absolute;
    inset: -30%;
    pointer-events: none;
    background: linear-gradient(112deg, transparent 35%, rgba(255,255,255,0.03) 43%, rgba(210,246,255,0.28) 49%, rgba(255,255,255,0.04) 55%, transparent 64%);
    transform: translateX(-55%);
    animation: sweep 3s cubic-bezier(0.3, 0.7, 0.3, 1) 0.25s both;
    mix-blend-mode: screen;
  }
  @keyframes sweep {
    from { transform: translateX(-55%); opacity: 0; }
    20% { opacity: 0.9; }
    to { transform: translateX(55%); opacity: 0; }
  }
  .cinema {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(90deg, rgba(1, 32, 58, 0.16), transparent 32%, transparent 68%, rgba(1, 32, 58, 0.14)),
      linear-gradient(0deg, rgba(1, 26, 48, 0.18), transparent 24%, transparent 80%, rgba(1, 26, 48, 0.08));
  }
  .particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0.38;
    background-image:
      radial-gradient(circle, rgba(255,255,255,0.9) 0 1px, transparent 1.5px),
      radial-gradient(circle, rgba(126,231,255,0.8) 0 1px, transparent 1.5px);
    background-position: 0 0, 36px 42px;
    background-size: 96px 96px, 132px 132px;
    mask-image: linear-gradient(90deg, #000, transparent 36%, transparent 68%, #000);
    animation: particles-drift 8s linear infinite;
  }
  @keyframes particles-drift {
    to { background-position: 96px -96px, -96px -90px; }
  }
  .glass-frame {
    position: absolute;
    inset: 22px;
    pointer-events: none;
    border: 1px solid rgba(255,255,255,0.24);
    border-radius: 22px;
    box-shadow: inset 0 0 40px rgba(255,255,255,0.04), 0 0 24px rgba(91,214,255,0.08);
  }
  .glass-frame::before,
  .glass-frame::after {
    content: "";
    position: absolute;
    width: 54px;
    height: 54px;
    border-color: rgba(255,255,255,0.72);
    border-style: solid;
  }
  .glass-frame::before {
    top: -1px;
    left: -1px;
    border-width: 2px 0 0 2px;
    border-radius: 22px 0 0;
  }
  .glass-frame::after {
    right: -1px;
    bottom: -1px;
    border-width: 0 2px 2px 0;
    border-radius: 0 0 22px;
  }
  .live-mark {
    position: absolute;
    top: 42px;
    right: 46px;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 13px;
    border: 1px solid rgba(255,255,255,0.24);
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    font-size: 9px;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.9);
  }
  .live-mark::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #fff38a;
    box-shadow: 0 0 12px #fff38a;
    animation: live-pulse 1.4s ease-in-out infinite;
  }
  @keyframes live-pulse {
    50% { opacity: 0.45; transform: scale(0.75); }
  }
  .brand {
    position: absolute;
    left: clamp(38px, 5.5vw, 88px);
    top: 50%;
    max-width: 36vw;
    transform: translateY(-50%);
    pointer-events: none;
  }
  .brand-kicker {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
    font-family: "Segoe UI", sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.42em;
    color: rgba(201, 239, 255, 0.76);
    opacity: 0;
    animation: brand-in 0.8s ease-out 0.45s forwards;
  }
  .brand-kicker::before {
    content: "";
    width: 28px;
    height: 2px;
    background: #79e2ff;
    box-shadow: 0 0 12px rgba(77, 214, 255, 0.9);
  }
  .brand-title {
    margin: 0;
    font-size: clamp(34px, 3.7vw, 58px);
    line-height: 1.25;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: #fff;
    text-shadow: 0 3px 24px rgba(0, 51, 102, 0.42), 0 0 34px rgba(83, 207, 255, 0.2);
    opacity: 0;
    animation: brand-in 1s cubic-bezier(0.2, 0.75, 0.25, 1) 0.62s forwards;
  }
  .brand-subtitle {
    margin-top: 16px;
    font-size: 12px;
    letter-spacing: 0.32em;
    color: rgba(225, 245, 255, 0.7);
    opacity: 0;
    animation: brand-in 0.8s ease-out 0.9s forwards;
  }
  @keyframes brand-in {
    from { opacity: 0; transform: translateX(-18px); filter: blur(4px); }
    to { opacity: 1; transform: translateX(0); filter: blur(0); }
  }
  .boot {
    position: absolute;
    right: clamp(38px, 5.5vw, 88px);
    bottom: clamp(44px, 8vh, 78px);
    width: clamp(180px, 18vw, 270px);
    opacity: 0;
    animation: boot-in 0.8s ease-out 1s forwards;
  }
  @keyframes boot-in {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .boot-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    font-size: 10px;
    letter-spacing: 0.16em;
    color: rgba(226, 246, 255, 0.74);
  }
  .boot-percent {
    font-family: "Consolas", monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: #fff;
  }
  .boot-track {
    height: 2px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.18);
  }
  .boot-bar {
    display: block;
    width: 100%;
    height: 100%;
    transform: scaleX(0);
    transform-origin: left;
    background: linear-gradient(90deg, #5de0ff, #fff6a5);
    box-shadow: 0 0 12px rgba(111, 228, 255, 0.8);
  }
  body.is-leaving .video-stage { transform: scale(1.04); filter: brightness(1.25); }
  body.is-leaving .brand, body.is-leaving .boot { opacity: 0; transition: opacity 0.25s ease; }
  @media (max-width: 1000px) {
    .brand { max-width: 31vw; }
    .brand-title { font-size: 32px; }
    .brand-subtitle { letter-spacing: 0.2em; }
  }
</style>
</head>
<body>
<div class="splash">
  <div class="ambient"></div>
  <div class="video-stage">
    <video id="splash-video" class="splash-video" src="./src/assets/niko-splash-4k.mp4" autoplay muted playsinline preload="auto"></video>
    <audio id="splash-welcome" src="./src/assets/niko-welcome.wav" autoplay preload="auto"></audio>
    <img class="splash-fallback" src="./src/assets/niko-login-bg-4k.jpg" alt="" />
  </div>
  <div class="light-sweep"></div>
  <div class="cinema"></div>
  <div class="particles"></div>
  <div class="glass-frame"></div>
  <div class="live-mark">NIKO · LIVE</div>

  <main class="brand">
    <div class="brand-kicker">NIKO LIVE COMPANION</div>
    <h1 class="brand-title">Niko直播伴侣</h1>
    <div class="brand-subtitle">快乐开播，即刻出发</div>
  </main>

  <footer class="boot">
    <div class="boot-meta">
      <span id="boot-status">直播系统启动中</span>
      <span class="boot-percent" id="boot-percent">00%</span>
    </div>
    <div class="boot-track"><i class="boot-bar" id="boot-bar"></i></div>
  </footer>
</div>
<script>
(function () {
  var video = document.getElementById('splash-video');
  var bar = document.getElementById('boot-bar');
  var percent = document.getElementById('boot-percent');
  var status = document.getElementById('boot-status');
  var startedAt = performance.now();

  function update() {
    var progress;
    if (video.duration && isFinite(video.duration)) {
      progress = video.currentTime / video.duration;
    } else {
      progress = (performance.now() - startedAt) / 5000;
    }
    progress = Math.max(0, Math.min(1, progress));
    bar.style.transform = 'scaleX(' + progress + ')';
    percent.textContent = String(Math.round(progress * 100)).padStart(2, '0') + '%';
    if (progress >= 0.99) status.textContent = 'Niko直播伴侣 准备就绪';
    requestAnimationFrame(update);
  }

  video.addEventListener('error', function () {
    document.body.classList.add('video-failed');
  });
  video.addEventListener('ended', function () {
    status.textContent = 'Niko直播伴侣 准备就绪';
  });
  requestAnimationFrame(update);
})();
</script>
</body>
</html>
